<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>股票候選手機查看版 MVP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-2: #f8fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);

      --chip-bg: #eef2f6;
      --chip-text: #4b5563;
      --chip-active-bg: #1f2937;
      --chip-active-text: #ffffff;

      --dual-bg: #f9e3e3;
      --dual-text: #8a3d3d;
      --dual-bar: #d97c7c;

      --day-bg: #f7f0d9;
      --day-text: #7a6132;
      --day-bar: #d2b55b;

      --overnight-bg: #e5f0f8;
      --overnight-text: #3f607a;
      --overnight-bar: #7fa8c7;

      --neutral-bg: #ffffff;
      --neutral-text: #374151;
      --neutral-bar: #cfd6dd;

      --level-s-bg: #fce7f3;
      --level-s-text: #9d174d;

      --level-a-bg: #ede9fe;
      --level-a-text: #5b21b6;

      --level-b-bg: #ecfccb;
      --level-b-text: #3f6212;

      --level-c-bg: #f3f4f6;
      --level-c-text: #4b5563;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 28px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -14px 14px;
      padding: 12px 14px 10px;
      background: rgba(243, 245, 247, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.75);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .title-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .refresh-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chip-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .summary-card .value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stock-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .stock-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--neutral-bar);
    }

    .stock-card.dual {
      background: var(--dual-bg);
      color: var(--dual-text);
    }

    .stock-card.dual::before {
      background: var(--dual-bar);
    }

    .stock-card.day {
      background: var(--day-bg);
      color: var(--day-text);
    }

    .stock-card.day::before {
      background: var(--day-bar);
    }

    .stock-card.overnight {
      background: var(--overnight-bg);
      color: var(--overnight-text);
    }

    .stock-card.overnight::before {
      background: var(--overnight-bar);
    }

    .stock-card.neutral {
      background: var(--neutral-bg);
      color: var(--neutral-text);
    }

    .card-inner {
      padding: 14px 14px 14px 18px;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .code-name .code {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .code-name .name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
      color: #111827;
    }

    .stock-card.dual .code-name .name,
    .stock-card.day .code-name .name,
    .stock-card.overnight .code-name .name {
      color: inherit;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.level-s {
      background: var(--level-s-bg);
      color: var(--level-s-text);
    }

    .badge.level-a {
      background: var(--level-a-bg);
      color: var(--level-a-text);
    }

    .badge.level-b {
      background: var(--level-b-bg);
      color: var(--level-b-text);
    }

    .badge.level-c {
      background: var(--level-c-bg);
      color: var(--level-c-text);
    }

    .badge.type {
      background: rgba(255,255,255,0.68);
      color: #374151;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .metric {
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .metric .label {
      font-size: 11px;
      color: rgba(55, 65, 81, 0.85);
      margin-bottom: 5px;
    }

    .metric .value {
      font-size: 17px;
      font-weight: 800;
      color: #111827;
      line-height: 1.15;
    }

    .reason {
      font-size: 13px;
      line-height: 1.55;
      color: #374151;
      background: rgba(255,255,255,0.54);
      border: 1px dashed rgba(148, 163, 184, 0.45);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .empty {
      display: none;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 28px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    @media (min-width: 768px) {
      .app {
        padding-top: 22px;
      }

      .list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title-row">
        <div class="title-wrap">
          <h1>今日候選名單</h1>
          <p id="updatedAt">更新時間：2026/05/13 14:50</p>
        </div>
        <button class="refresh-btn" type="button" onclick="mockRefresh()">重新整理</button>
      </div>

      <div class="chip-scroll" id="filterChips"></div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="empty" id="emptyState">目前沒有符合條件的股票。</div>
    <div class="list" id="stockList"></div>
  </div>

  <script>
    const sampleRows = [
      {
        symbol: "2330",
        name: "台積電",
        daytrade_level: "A級",
        overnight_level: "S級",
        change_pct: -1.55,
        volume: 35237,
        turnover_value: 78115045000,
        amplitude_pct: 1.55,
        daytrade_flag: "Y",
        overnight_flag: "Y",
        tags: "高成交值 / 權值股 / 焦點股",
        daytrade_reason: "成交值大、流動性佳，適合盤中觀察。",
        overnight_reason: "具市場代表性，隔日延續性強。"
      },
      {
        symbol: "2603",
        name: "長榮",
        daytrade_level: "S級",
        overnight_level: "B級",
        change_pct: 3.21,
        volume: 48122,
        turnover_value: 9620000000,
        amplitude_pct: 5.42,
        daytrade_flag: "Y",
        overnight_flag: "",
        tags: "航運 / 強波動 / 高量",
        daytrade_reason: "振幅與量能兼具，短線活躍度高。",
        overnight_reason: "延續性普通，先列觀察。"
      },
      {
        symbol: "1815",
        name: "富喬",
        daytrade_level: "B級",
        overnight_level: "A級",
        change_pct: 6.84,
        volume: 76310,
        turnover_value: 4230000000,
        amplitude_pct: 8.27,
        daytrade_flag: "",
        overnight_flag: "Y",
        tags: "電子材料 / 強勢股 / 主題",
        daytrade_reason: "當沖分數中等。",
        overnight_reason: "趨勢延續與題材性較強。"
      },
      {
        symbol: "3017",
        name: "奇鋐",
        daytrade_level: "B級",
        overnight_level: "B級",
        change_pct: 2.18,
        volume: 18654,
        turnover_value: 5580000000,
        amplitude_pct: 3.76,
        daytrade_flag: "Y",
        overnight_flag: "Y",
        tags: "散熱 / AI / 高人氣",
        daytrade_reason: "量價表現穩定。",
        overnight_reason: "隔日觀察價值仍在。"
      },
      {
        symbol: "4976",
        name: "佳凌",
        daytrade_level: "C級",
        overnight_level: "B級",
        change_pct: -0.42,
        volume: 9322,
        turnover_value: 318000000,
        amplitude_pct: 2.11,
        daytrade_flag: "",
        overnight_flag: "Y",
        tags: "光學 / 量縮整理",
        daytrade_reason: "當沖條件偏弱。",
        overnight_reason: "可低優先觀察。"
      }
    ];

    const filters = [
      { key: "all", label: "全部" },
      { key: "day", label: "當沖候選" },
      { key: "overnight", label: "隔日沖候選" },
      { key: "s", label: "S級" },
      { key: "a_up", label: "A級以上" },
      { key: "b_up", label: "B級以上" }
    ];

    let currentFilter = "all";

    function getCardClass(row) {
      const isDay = row.daytrade_flag === "Y";
      const isNight = row.overnight_flag === "Y";
      if (isDay && isNight) return "dual";
      if (isDay) return "day";
      if (isNight) return "overnight";
      return "neutral";
    }

    function getTypeLabel(row) {
      const isDay = row.daytrade_flag === "Y";
      const isNight = row.overnight_flag === "Y";
      if (isDay && isNight) return "雙候選";
      if (isDay) return "當沖";
      if (isNight) return "隔日沖";
      return "觀察";
    }

    function levelRank(level) {
      if (level === "S級") return 4;
      if (level === "A級") return 3;
      if (level === "B級") return 2;
      if (level === "C級") return 1;
      return 0;
    }

    function matchesFilter(row, filterKey) {
      const day = row.daytrade_flag === "Y";
      const night = row.overnight_flag === "Y";
      const bestRank = Math.max(levelRank(row.daytrade_level), levelRank(row.overnight_level));

      if (filterKey === "all") return true;
      if (filterKey === "day") return day;
      if (filterKey === "overnight") return night;
      if (filterKey === "s") return bestRank >= 4;
      if (filterKey === "a_up") return bestRank >= 3;
      if (filterKey === "b_up") return bestRank >= 2;
      return true;
    }

    function formatNumber(num) {
      if (num === "" || num === null || num === undefined || isNaN(num)) return "--";
      return Number(num).toLocaleString("zh-Hant-TW");
    }

    function formatPct(num) {
      if (num === "" || num === null || num === undefined || isNaN(num)) return "--";
      const n = Number(num);
      return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
    }

    function formatAmount(num) {
      if (num === "" || num === null || num === undefined || isNaN(num)) return "--";
      const n = Number(num);
      if (n >= 100000000) return (n / 100000000).toFixed(2) + " 億";
      if (n >= 10000) return (n / 10000).toFixed(0) + " 萬";
      return n.toLocaleString("zh-Hant-TW");
    }

    function renderFilters() {
      const wrap = document.getElementById("filterChips");
      wrap.innerHTML = filters.map(f => `
        <button class="chip ${currentFilter === f.key ? 'active' : ''}" onclick="setFilter('${f.key}')">
          ${f.label}
        </button>
      `).join("");
    }

    function renderSummary(rows) {
      const box = document.getElementById("summary");
      const total = rows.length;
      const dualCount = rows.filter(r => r.daytrade_flag === "Y" && r.overnight_flag === "Y").length;
      const sCount = rows.filter(r => Math.max(levelRank(r.daytrade_level), levelRank(r.overnight_level)) >= 4).length;

      box.innerHTML = `
        <div class="summary-card">
          <div class="label">目前筆數</div>
          <div class="value">${total}</div>
        </div>
        <div class="summary-card">
          <div class="label">雙候選</div>
          <div class="value">${dualCount}</div>
        </div>
        <div class="summary-card">
          <div class="label">S級</div>
          <div class="value">${sCount}</div>
        </div>
      `;
    }

    function createLevelBadge(level) {
      const lv = (level || "").replace("級", "").toLowerCase();
      return `<span class="badge level-${lv || 'c'}">${level || '--'}</span>`;
    }

    function renderList() {
      const list = document.getElementById("stockList");
      const empty = document.getElementById("emptyState");
      const filtered = sampleRows.filter(row => matchesFilter(row, currentFilter));

      renderSummary(filtered);

      if (filtered.length === 0) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      list.innerHTML = filtered.map(row => `
        <div class="stock-card ${getCardClass(row)}">
          <div class="card-inner">
            <div class="top-row">
              <div class="code-name">
                <div class="code">${row.symbol}</div>
                <div class="name">${row.name}</div>
              </div>

              <div class="badges">
                <span class="badge type">${getTypeLabel(row)}</span>
                ${createLevelBadge(row.daytrade_level)}
                ${createLevelBadge(row.overnight_level)}
              </div>
            </div>

            <div class="metrics">
              <div class="metric">
                <div class="label">漲跌幅</div>
                <div class="value">${formatPct(row.change_pct)}</div>
              </div>
              <div class="metric">
                <div class="label">振幅</div>
                <div class="value">${formatPct(row.amplitude_pct)}</div>
              </div>
              <div class="metric">
                <div class="label">成交量</div>
                <div class="value">${formatAmount(row.volume)}</div>
              </div>
              <div class="metric">
                <div class="label">成交值</div>
                <div class="value">${formatAmount(row.turnover_value)}</div>
              </div>
            </div>

            <div class="reason">
              <div><strong>標籤：</strong>${row.tags || "—"}</div>
              <div style="margin-top:6px;"><strong>理由：</strong>${row.daytrade_reason || row.overnight_reason || "—"}</div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function setFilter(key) {
      currentFilter = key;
      renderFilters();
      renderList();
    }

    function mockRefresh() {
      const now = new Date();
      const text = now.getFullYear() + "/" +
        String(now.getMonth() + 1).padStart(2, "0") + "/" +
        String(now.getDate()).padStart(2, "0") + " " +
        String(now.getHours()).padStart(2, "0") + ":" +
        String(now.getMinutes()).padStart(2, "0");
      document.getElementById("updatedAt").textContent = "更新時間：" + text;
    }

    renderFilters();
    renderList();
  </script>
</body>
</html>
