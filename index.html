<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>stock-mobile-mvp</title>
  <meta name="description" content="台股策略手機看盤 MVP" />
  <style>
    :root{
      --bg:#f6f3ee;
      --card:#fffdf9;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#0f766e;
      --up:#c2410c;
      --down:#0f766e;
      --chip:#f3f4f6;
      --chip-active:#0f766e;
      --chip-active-text:#ffffff;
      --soft:#faf7f2;
      --shadow:0 10px 30px rgba(0,0,0,.06);
      --radius:18px;

      --daytrade:#2563eb;
      --overnight:#dc2626;
      --both:#ca8a04;
      --daytrade-soft:#dbeafe;
      --overnight-soft:#fee2e2;
      --both-soft:#fef3c7;
      --neutral-soft:#f3f4f6;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .app{
      max-width:760px;
      margin:0 auto;
      padding:12px 14px 88px;
    }

    .header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(246,243,238,.94);
      backdrop-filter:blur(12px);
      padding:10px 0 12px;
    }

    h1{
      margin:0;
      font-size:24px;
      line-height:1.15;
    }

    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }

    .toolbar{
      display:flex;
      gap:8px;
      margin-top:12px;
      overflow:auto;
      padding-bottom:4px;
      -ms-overflow-style:none;
      scrollbar-width:none;
    }
    .toolbar::-webkit-scrollbar{display:none}

    .btn,.chip{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      white-space:nowrap;
      flex:0 0 auto;
      cursor:pointer;
    }

    .btn{
      background:var(--primary);
      color:#fff;
      font-weight:700;
    }

    .chip{
      background:var(--chip);
      color:var(--text);
    }

    .chip.active{
      background:var(--chip-active);
      color:var(--chip-active-text);
    }

    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .summary-bar{
      margin:12px 0 12px;
      padding:12px 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      font-size:13px;
      color:var(--muted);
    }

    .summary-item{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .summary-value{
      color:var(--text);
      font-size:15px;
      font-weight:800;
    }

    .search-wrap{
      margin:10px 0 12px;
    }

    .search{
      width:100%;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      font-size:16px;
      background:#fff;
      outline:none;
    }

    .search:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(15,118,110,.12);
    }

    .viewbar{
      display:flex;
      gap:8px;
      margin-bottom:12px;
      overflow:auto;
      padding-bottom:4px;
      -ms-overflow-style:none;
      scrollbar-width:none;
    }
    .viewbar::-webkit-scrollbar{display:none}

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .list.compact-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .card{
      padding:14px 14px 12px;
    }

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .left{
      min-width:0;
      flex:1;
    }

    .symbol-line{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#d1d5db;
      flex:0 0 auto;
    }

    .dot.daytrade{ background:var(--daytrade); }
    .dot.overnight{ background:var(--overnight); }
    .dot.both{ background:var(--both); }

    .symbol{
      font-size:18px;
      font-weight:800;
      letter-spacing:.2px;
      flex:0 0 auto;
    }

    .name{
      color:var(--muted);
      font-size:13px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      margin-top:4px;
    }

    .price{
      text-align:right;
      flex:0 0 auto;
    }

    .price-main{
      font-size:20px;
      font-weight:800;
      line-height:1.1;
    }

    .chg{
      margin-top:4px;
      font-size:14px;
      font-weight:700;
    }

    .up{color:var(--up)}
    .down{color:var(--down)}

    .meta-row{
      margin-top:12px;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
    }

    .mini{
      background:var(--soft);
      border-radius:12px;
      padding:8px 10px;
      min-width:0;
    }

    .mini-label{
      font-size:11px;
      color:var(--muted);
      line-height:1.2;
    }

    .mini-value{
      margin-top:4px;
      font-size:14px;
      font-weight:800;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:10px;
    }

    .tag{
      padding:6px 9px;
      border-radius:999px;
      font-size:11px;
      line-height:1;
      font-weight:700;
    }

    .tag.daytrade{
      background:var(--daytrade-soft);
      color:var(--daytrade);
    }

    .tag.overnight{
      background:var(--overnight-soft);
      color:var(--overnight);
    }

    .tag.both{
      background:var(--both-soft);
      color:#92400e;
    }

    .tag.normal{
      background:var(--neutral-soft);
      color:#374151;
      font-weight:600;
    }

    .compact-grid .card{
      padding:12px;
    }

    .compact-grid .top{
      gap:8px;
    }

    .compact-grid .symbol{
      font-size:16px;
    }

    .compact-grid .name{
      font-size:12px;
      margin-top:3px;
    }

    .compact-grid .price-main{
      font-size:17px;
    }

    .compact-grid .chg{
      font-size:12px;
    }

    .compact-grid .meta-row{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:6px;
      margin-top:10px;
    }

    .compact-grid .mini{
      padding:7px 8px;
    }

    .compact-grid .mini-label{
      font-size:10px;
    }

    .compact-grid .mini-value{
      font-size:12px;
    }

    .compact-grid .tags{
      gap:5px;
      margin-top:8px;
    }

    .compact-grid .tag{
      font-size:10px;
      padding:5px 7px;
    }

    .empty,.loading,.error{
      padding:18px;
      text-align:center;
      color:var(--muted);
    }

    .footer-note{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    @media (max-width:420px){
      .meta-row{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
      h1{
        font-size:22px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>台股策略清單</h1>
      <div class="sub" id="updatedAt">讀取中…</div>

      <div class="toolbar">
        <button class="btn" id="refreshBtn">更新列表</button>
        <button class="chip filter-btn active" data-filter="all">全部</button>
        <button class="chip filter-btn" data-filter="daytrade">當沖</button>
        <button class="chip filter-btn" data-filter="overnight">隔日</button>
        <button class="chip filter-btn" data-filter="both">雙候選</button>
      </div>
    </div>

    <div class="panel summary-bar">
      <div class="summary-item">總數 <span class="summary-value" id="countStat">-</span></div>
      <div class="summary-item">S/A <span class="summary-value" id="levelStat">-</span></div>
      <div class="summary-item">雙候選 <span class="summary-value" id="bothStat">-</span></div>
    </div>

    <div class="search-wrap">
      <input id="searchInput" class="search" placeholder="搜尋代號 / 名稱 / ETF / 產業" />
    </div>

    <div class="viewbar">
      <button class="chip active" id="singleViewBtn">清單模式</button>
      <button class="chip" id="compactViewBtn">速覽模式</button>
    </div>

    <div id="list" class="list">
      <div class="panel loading">載入中…</div>
    </div>

    <div class="footer-note">stock-mobile-mvp</div>
  </div>

  <script>
    const API_URL = '/api/strategy';

    let allRows = [];
    let currentFilter = 'all';
    let currentView = 'single';

    const listEl = document.getElementById('list');
    const updatedAtEl = document.getElementById('updatedAt');
    const countStatEl = document.getElementById('countStat');
    const levelStatEl = document.getElementById('levelStat');
    const bothStatEl = document.getElementById('bothStat');
    const searchInput = document.getElementById('searchInput');
    const singleViewBtn = document.getElementById('singleViewBtn');
    const compactViewBtn = document.getElementById('compactViewBtn');

    function formatNumber(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      return new Intl.NumberFormat('zh-TW').format(num);
    }

    function formatMoney(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      if (num >= 100000000) return (num / 100000000).toFixed(2) + '億';
      if (num >= 10000) return (num / 10000).toFixed(0) + '萬';
      return formatNumber(num);
    }

    function formatPct(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      return (num > 0 ? '+' : '') + num.toFixed(2) + '%';
    }

    function getTagObjects(row){
      const tags = [];

      const hasDay = row.daytradeflag === 'Y';
      const hasOver = row.overnightflag === 'Y';

      if (hasDay && hasOver) {
        tags.push({ text:'雙候選', cls:'both' });
      } else if (hasDay) {
        tags.push({ text:'當沖候選', cls:'daytrade' });
      } else if (hasOver) {
        tags.push({ text:'隔日候選', cls:'overnight' });
      }

      const rawTags = String(row.tags || '')
        .split(',')
        .map(v => v.trim())
        .filter(Boolean);

      rawTags.slice(0, 3).forEach(tag => {
        tags.push({ text: tag, cls:'normal' });
      });

      if (!tags.length && row.industry) {
        tags.push({ text: row.industry, cls:'normal' });
      }

      return tags.slice(0, 4);
    }

    function getDotClass(row){
      const d = row.daytradeflag === 'Y';
      const o = row.overnightflag === 'Y';
      if (d && o) return 'both';
      if (d) return 'daytrade';
      if (o) return 'overnight';
      return '';
    }

    function matchFilter(row){
      if (currentFilter === 'all') return true;
      if (currentFilter === 'daytrade') return row.daytradeflag === 'Y';
      if (currentFilter === 'overnight') return row.overnightflag === 'Y';
      if (currentFilter === 'both') return row.daytradeflag === 'Y' && row.overnightflag === 'Y';
      return true;
    }

    function matchKeyword(row, keyword){
      if (!keyword) return true;
      const k = keyword.trim().toLowerCase();
      return String(row.symbol || '').toLowerCase().includes(k) ||
             String(row.name || '').toLowerCase().includes(k) ||
             String(row.tags || '').toLowerCase().includes(k) ||
             String(row.industry || '').toLowerCase().includes(k);
    }

    function renderStats(rows){
      countStatEl.textContent = rows.length;

      const sa = rows.filter(r =>
        r.daytradelevel === 'S' || r.daytradelevel === 'A' ||
        r.overnightlevel === 'S' || r.overnightlevel === 'A'
      ).length;

      const both = rows.filter(r =>
        r.daytradeflag === 'Y' && r.overnightflag === 'Y'
      ).length;

      levelStatEl.textContent = sa;
      bothStatEl.textContent = both;
    }

    function applyViewMode(){
      if (currentView === 'compact') {
        listEl.classList.add('compact-grid');
        singleViewBtn.classList.remove('active');
        compactViewBtn.classList.add('active');
      } else {
        listEl.classList.remove('compact-grid');
        singleViewBtn.classList.add('active');
        compactViewBtn.classList.remove('active');
      }
    }

    function renderList(){
      const keyword = searchInput.value || '';
      const rows = allRows.filter(r => matchFilter(r) && matchKeyword(r, keyword));

      renderStats(rows);
      applyViewMode();

      if (!rows.length) {
        listEl.innerHTML = '<div class="panel empty">沒有符合的股票</div>';
        return;
      }

      listEl.innerHTML = rows.map(row => {
        const pct = Number(row.changepct);
        const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
        const tagObjects = getTagObjects(row);
        const dotClass = getDotClass(row);

        return `
          <div class="panel card">
            <div class="top">
              <div class="left">
                <div class="symbol-line">
                  <span class="dot ${dotClass}"></span>
                  <span class="symbol">${row.symbol || '-'}</span>
                </div>
                <div class="name">${row.name || '-'}</div>
              </div>

              <div class="price">
                <div class="price-main">${row.price ?? '-'}</div>
                <div class="chg ${cls}">${formatPct(row.changepct)}</div>
              </div>
            </div>

            <div class="meta-row">
              <div class="mini">
                <div class="mini-label">當沖</div>
                <div class="mini-value">${row.daytradescore ?? '-'} / ${row.daytradelevel || '-'}</div>
              </div>
              <div class="mini">
                <div class="mini-label">隔日</div>
                <div class="mini-value">${row.overnightscore ?? '-'} / ${row.overnightlevel || '-'}</div>
              </div>
              <div class="mini">
                <div class="mini-label">成交值</div>
                <div class="mini-value">${formatMoney(row.turnovervalue)}</div>
              </div>
              <div class="mini">
                <div class="mini-label">振幅</div>
                <div class="mini-value">${row.amplitudepct ?? '-'}%</div>
              </div>
            </div>

            <div class="tags">
              ${tagObjects.map(tag => `<span class="tag ${tag.cls}">${tag.text}</span>`).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchData(){
      listEl.innerHTML = '<div class="panel loading">載入中…</div>';
      updatedAtEl.textContent = '讀取中…';

      try{
        const res = await fetch(API_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        const text = await res.text();

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('API 沒有回傳 JSON');
        }

        if (!data || !data.ok || !Array.isArray(data.rows)) {
          throw new Error('API 回傳格式錯誤');
        }

        allRows = data.rows.map(r => ({
          symbol: r.symbol,
          name: r.name,
          daytradescore: Number(r.daytrade_score || r.daytradescore || 0),
          daytradelevel: String(r.daytrade_level || r.daytradelevel || '').replace('級', ''),
          overnightscore: Number(r.overnight_score || r.overnightscore || 0),
          overnightlevel: String(r.overnight_level || r.overnightlevel || '').replace('級', ''),
          price: Number(r.price || 0),
          changepct: Number(r.change_pct ?? r.changepct ?? 0),
          volume: Number(r.volume || 0),
          turnovervalue: Number(r.turnover_value || r.turnovervalue || 0),
          amplitudepct: Number(r.amplitude_pct || r.amplitudepct || 0),
          daytradeflag: r.daytrade_flag || r.daytradeflag || '',
          overnightflag: r.overnight_flag || r.overnightflag || '',
          longtermflag: r.longterm_flag || r.longtermflag || '',
          tags: r.tags || '',
          memo: r.memo || '',
          industry: r.industry || '',
          updatedat: r.updated_at || r.updatedat || ''
        }));

        updatedAtEl.textContent = `更新時間：${data.updatedAt || '未知'} ・ 共 ${data.count || allRows.length} 筆`;
        renderList();
      }catch(err){
        listEl.classList.remove('compact-grid');
        listEl.innerHTML = `<div class="panel error">讀取失敗：${err.message}</div>`;
        updatedAtEl.textContent = '資料讀取失敗';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchData);
    searchInput.addEventListener('input', renderList);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
      });
    });

    singleViewBtn.addEventListener('click', () => {
      currentView = 'single';
      renderList();
    });

    compactViewBtn.addEventListener('click', () => {
      currentView = 'compact';
      renderList();
    });

    fetchData();
  </script>
</body>
</html>
