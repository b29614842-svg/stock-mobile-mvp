<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>stock-mobile-mvp</title>
  <meta name="description" content="台股策略手機看盤 MVP" />
  <style>
    :root{
      --bg:#f6f3ee;
      --card:#fffdf9;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#0f766e;
      --up:#c2410c;
      --down:#0f766e;
      --chip:#f3f4f6;
      --chip-active:#0f766e;
      --chip-active-text:#ffffff;
      --soft:#faf7f2;
      --shadow:0 10px 24px rgba(0,0,0,.05);
      --radius:18px;

      --day:#dc2626;   /* 當沖：紅 */
      --swing:#2563eb; /* 隔日：藍 */
      --price-bg:#fffaf3;
      --price-line:#f3d9b1;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .app{
      max-width:760px;
      margin:0 auto;
      padding:12px 14px 88px;
    }

    .header{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(246,243,238,.94);
      backdrop-filter:blur(12px);
      padding:10px 0 12px;
    }

    h1{
      margin:0;
      font-size:24px;
      line-height:1.15;
    }

    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }

    .toolbar,.viewbar{
      display:flex;
      gap:8px;
      margin-top:12px;
      overflow:auto;
      padding-bottom:4px;
      -ms-overflow-style:none;
      scrollbar-width:none;
    }
    .toolbar::-webkit-scrollbar,
    .viewbar::-webkit-scrollbar{display:none}

    .btn,.chip{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      white-space:nowrap;
      flex:0 0 auto;
      cursor:pointer;
    }

    .btn{
      background:var(--primary);
      color:#fff;
      font-weight:700;
    }

    .chip{
      background:var(--chip);
      color:var(--text);
    }

    .chip.active{
      background:var(--chip-active);
      color:var(--chip-active-text);
    }

    .search-wrap{
      margin:12px 0;
    }

    .search{
      width:100%;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      font-size:16px;
      background:#fff;
      outline:none;
    }

    .search:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(15,118,110,.12);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:12px;
    }

    .list.compact-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:12px;
    }

    .stock-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
    }

    .left{
      min-width:0;
      flex:1;
    }

    .dots{
      display:flex;
      align-items:center;
      gap:5px;
      margin-bottom:6px;
      min-height:10px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      display:inline-block;
    }

    .dot.day{ background:var(--day); }
    .dot.swing{ background:var(--swing); }

    .symbol-row{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .symbol{
      font-size:18px;
      font-weight:800;
      letter-spacing:.2px;
      line-height:1.1;
    }

    .name{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .price-box{
      min-width:88px;
      padding:8px 10px;
      border:1px solid var(--price-line);
      background:var(--price-bg);
      border-radius:14px;
      text-align:center;
      flex:0 0 auto;
    }

    .price-main{
      font-size:20px;
      font-weight:800;
      line-height:1.1;
    }

    .chg{
      margin-top:4px;
      font-size:12px;
      font-weight:700;
    }

    .up{color:var(--up)}
    .down{color:var(--down)}

    .info-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .info{
      background:var(--soft);
      border-radius:12px;
      padding:8px 10px;
      min-width:0;
    }

    .info-label{
      font-size:11px;
      color:var(--muted);
      line-height:1.2;
    }

    .info-value{
      margin-top:4px;
      font-size:14px;
      font-weight:800;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .compact-grid .card{
      padding:10px;
    }

    .compact-grid .stock-head{
      margin-bottom:8px;
      gap:6px;
    }

    .compact-grid .symbol{
      font-size:16px;
    }

    .compact-grid .name{
      font-size:11px;
    }

    .compact-grid .price-box{
      min-width:76px;
      padding:7px 8px;
      border-radius:12px;
    }

    .compact-grid .price-main{
      font-size:17px;
    }

    .compact-grid .chg{
      font-size:11px;
    }

    .compact-grid .info{
      padding:7px 8px;
    }

    .compact-grid .info-label{
      font-size:10px;
    }

    .compact-grid .info-value{
      font-size:12px;
    }

    .empty,.loading,.error{
      padding:18px;
      text-align:center;
      color:var(--muted);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
    }

    .footer-note{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    @media (max-width:420px){
      h1{ font-size:22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>台股策略清單</h1>
      <div class="sub" id="updatedAt">讀取中…</div>

      <div class="toolbar">
        <button class="btn" id="refreshBtn">更新列表</button>
        <button class="chip filter-btn active" data-filter="all">全部</button>
        <button class="chip filter-btn" data-filter="daytrade">當沖</button>
        <button class="chip filter-btn" data-filter="overnight">隔日</button>
        <button class="chip filter-btn" data-filter="both">雙點</button>
      </div>

      <div class="viewbar">
        <button class="chip active" id="singleViewBtn">清單模式</button>
        <button class="chip" id="compactViewBtn">速覽模式</button>
      </div>
    </div>

    <div class="search-wrap">
      <input id="searchInput" class="search" placeholder="搜尋代號 / 名稱 / ETF / 產業" />
    </div>

    <div id="list" class="list">
      <div class="loading">載入中…</div>
    </div>

    <div class="footer-note">stock-mobile-mvp</div>
  </div>

  <script>
    const API_URL = '/api/strategy';

    let allRows = [];
    let currentFilter = 'all';
    let currentView = 'single';

    const listEl = document.getElementById('list');
    const updatedAtEl = document.getElementById('updatedAt');
    const searchInput = document.getElementById('searchInput');
    const singleViewBtn = document.getElementById('singleViewBtn');
    const compactViewBtn = document.getElementById('compactViewBtn');

    function formatNumber(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      return new Intl.NumberFormat('zh-TW').format(num);
    }

    function formatVolume(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return formatNumber(num);
    }

    function formatPct(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      return (num > 0 ? '+' : '') + num.toFixed(2) + '%';
    }

    function formatOpen(n){
      const num = Number(n);
      if (!Number.isFinite(num)) return '-';
      return num % 1 === 0 ? String(num) : num.toFixed(1);
    }

    function getDots(row){
      const dots = [];
      if (row.daytradeflag === 'Y') dots.push('<span class="dot day"></span>');
      if (row.overnightflag === 'Y') dots.push('<span class="dot swing"></span>');
      return dots.join('');
    }

    function matchFilter(row){
      if (currentFilter === 'all') return true;
      if (currentFilter === 'daytrade') return row.daytradeflag === 'Y';
      if (currentFilter === 'overnight') return row.overnightflag === 'Y';
      if (currentFilter === 'both') return row.daytradeflag === 'Y' && row.overnightflag === 'Y';
      return true;
    }

    function matchKeyword(row, keyword){
      if (!keyword) return true;
      const k = keyword.trim().toLowerCase();
      return String(row.symbol || '').toLowerCase().includes(k) ||
             String(row.name || '').toLowerCase().includes(k) ||
             String(row.industry || '').toLowerCase().includes(k) ||
             String(row.tags || '').toLowerCase().includes(k);
    }

    function applyViewMode(){
      if (currentView === 'compact') {
        listEl.classList.add('compact-grid');
        singleViewBtn.classList.remove('active');
        compactViewBtn.classList.add('active');
      } else {
        listEl.classList.remove('compact-grid');
        singleViewBtn.classList.add('active');
        compactViewBtn.classList.remove('active');
      }
    }

    function renderList(){
      const keyword = searchInput.value || '';
      const rows = allRows.filter(r => matchFilter(r) && matchKeyword(r, keyword));

      applyViewMode();

      if (!rows.length) {
        listEl.innerHTML = '<div class="empty">沒有符合的股票</div>';
        return;
      }

      listEl.innerHTML = rows.map(row => {
        const pct = Number(row.changepct);
        const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
        const dots = getDots(row);

        return `
          <div class="card">
            <div class="stock-head">
              <div class="left">
                <div class="dots">${dots}</div>
                <div class="symbol-row">
                  <div class="symbol">${row.symbol || '-'}</div>
                </div>
                <div class="name">${row.name || '-'}</div>
              </div>

              <div class="price-box">
                <div class="price-main">${row.price ?? '-'}</div>
                <div class="chg ${cls}">${formatPct(row.changepct)}</div>
              </div>
            </div>

            <div class="info-grid">
              <div class="info">
                <div class="info-label">振幅</div>
                <div class="info-value">${row.amplitudepct ?? '-'}%</div>
              </div>
              <div class="info">
                <div class="info-label">開盤</div>
                <div class="info-value">${formatOpen(row.openprice)}</div>
              </div>
              <div class="info">
                <div class="info-label">量</div>
                <div class="info-value">${formatVolume(row.volume)}</div>
              </div>
              <div class="info">
                <div class="info-label">分數</div>
                <div class="info-value">日 ${row.daytradescore ?? '-'} / 隔 ${row.overnightscore ?? '-'}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function fetchData(){
      listEl.innerHTML = '<div class="loading">載入中…</div>';
      updatedAtEl.textContent = '讀取中…';

      try{
        const res = await fetch(API_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        const text = await res.text();

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('API 沒有回傳 JSON');
        }

        if (!data || !data.ok || !Array.isArray(data.rows)) {
          throw new Error('API 回傳格式錯誤');
        }

        allRows = data.rows.map(r => ({
          symbol: r.symbol,
          name: r.name,
          daytradescore: Number(r.daytrade_score || r.daytradescore || 0),
          daytradelevel: String(r.daytrade_level || r.daytradelevel || '').replace('級', ''),
          overnightscore: Number(r.overnight_score || r.overnightscore || 0),
          overnightlevel: String(r.overnight_level || r.overnightlevel || '').replace('級', ''),
          price: Number(r.price || 0),
          openprice: Number(r.open_price ?? r.openprice ?? 0),
          changepct: Number(r.change_pct ?? r.changepct ?? 0),
          volume: Number(r.volume || 0),
          turnovervalue: Number(r.turnover_value || r.turnovervalue || 0),
          amplitudepct: Number(r.amplitude_pct || r.amplitudepct || 0),
          daytradeflag: r.daytrade_flag || r.daytradeflag || '',
          overnightflag: r.overnight_flag || r.overnightflag || '',
          longtermflag: r.longterm_flag || r.longtermflag || '',
          tags: r.tags || '',
          memo: r.memo || '',
          industry: r.industry || '',
          updatedat: r.updated_at || r.updatedat || ''
        }));

        updatedAtEl.textContent = `更新時間：${data.updatedAt || '未知'} ・ 共 ${data.count || allRows.length} 筆`;
        renderList();
      }catch(err){
        listEl.classList.remove('compact-grid');
        listEl.innerHTML = `<div class="error">讀取失敗：${err.message}</div>`;
        updatedAtEl.textContent = '資料讀取失敗';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchData);
    searchInput.addEventListener('input', renderList);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
      });
    });

    singleViewBtn.addEventListener('click', () => {
      currentView = 'single';
      renderList();
    });

    compactViewBtn.addEventListener('click', () => {
      currentView = 'compact';
      renderList();
    });

    fetchData();
  </script>
</body>
</html>
